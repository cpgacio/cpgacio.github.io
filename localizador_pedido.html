<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estado de Pedido - Normon - SAP Service Cloud</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
:root{
  --brand:#0070F2;--brand-d:#0057CC;
  --shell:#002A86;--shell2:#00144A;
  --bg:#F2F3F4;--surface:#FFF;--surface2:#FAFBFC;
  --border:#D9DBDD;--border-l:#EAECEE;
  --text:#1D2D3E;--text2:#556B82;--text3:#8095A8;
  --ok:#107E3E;--ok-bg:#E8F5EE;
  --warn:#E76500;--warn-bg:#FEF0E0;
  --info-bg:#E8F2FD;--neutral:#5C6873;--neutral-bg:#EEF0F2;
  --purple:#5C5C9E;--purple-bg:#F0EFFC;
  --r:8px;--sh:0 1px 4px rgba(0,0,0,.08),0 0 1px rgba(0,0,0,.06);
  --f:'Inter','72',sans-serif
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
/* Shell */
.shell{background:var(--shell);height:44px;display:flex;align-items:center;padding:0 24px;gap:0;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,40,.3)}
.slogo{width:40px;height:20px;background:#fff;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--shell);letter-spacing:.05em;flex-shrink:0;margin-right:16px}
.sdiv{width:1px;height:22px;background:rgba(255,255,255,.2);margin:0 16px}
.sapp{font-size:13px;font-weight:600;color:rgba(255,255,255,.9)}
.ssp{flex:1}
.sav{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;font-weight:700;color:#fff;border:1.5px solid rgba(255,255,255,.25)}
.sib{width:32px;height:32px;border-radius:50%;background:transparent;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;margin-left:4px}
.sib:hover{background:rgba(255,255,255,.12)}
.sib svg{width:16px;height:16px;fill:rgba(255,255,255,.85)}
.sun{font-size:11.5px;color:rgba(255,255,255,.8);margin-left:8px;font-weight:500}
/* Demo */
.dbar{background:var(--shell2);padding:8px 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(255,255,255,.06)}
.dlbl{font-size:10px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.4);text-transform:uppercase;white-space:nowrap}
.dtabs{display:flex;gap:6px}
.dtab{padding:4px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,.18);background:transparent;font-size:11px;font-weight:600;font-family:var(--f);cursor:pointer;color:rgba(255,255,255,.6);transition:all .18s}
.dtab:hover{border-color:rgba(255,255,255,.5);color:#fff}
.dtab.on{border-color:var(--brand);background:var(--brand);color:#fff}
.dtab[data-s="R"].on{background:var(--warn);border-color:var(--warn)}
.dtab[data-s="E"].on{background:var(--ok);border-color:var(--ok)}
/* Page header */
.phdr{background:var(--surface);border-bottom:1px solid var(--border-l);padding:0 24px;display:flex;align-items:center;gap:12px;height:56px}
.bc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);flex-shrink:0}
.bc a{color:var(--brand);font-weight:500;cursor:pointer;text-decoration:none}
.bc a:hover{text-decoration:underline}
.bc-sep{font-size:11px}
.bc-cur{color:var(--text);font-weight:600}
.hsp2{width:1px;height:28px;background:var(--border-l);margin:0 4px}
.htitle{font-size:15px;font-weight:700;color:var(--text)}
.hbadge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;flex-shrink:0}
.hbadge .dot{width:7px;height:7px;border-radius:50%}
.psp{flex:1}
.hact{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);border:none;font-family:var(--f);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap}
.btn svg{width:14px;height:14px;fill:currentColor;flex-shrink:0}
.btn-p{background:var(--brand);color:#fff}.btn-p:hover{background:var(--brand-d)}
.btn-s{background:var(--surface);color:var(--brand);border:1.5px solid var(--brand)}.btn-s:hover{background:var(--info-bg)}
.btn-g{background:var(--surface);color:var(--text2);border:1.5px solid var(--border)}.btn-g:hover{border-color:var(--brand);color:var(--brand)}
.btn-sm{padding:6px 14px;font-size:11.5px}
/* Layout */
.layout{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 108px)}
.lcol{background:var(--surface2);border-right:1px solid var(--border-l);padding:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;height:calc(100vh - 108px);position:sticky;top:108px}
.rcol{padding:20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;height:calc(100vh - 108px)}
/* Cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border-l);overflow:hidden}
.ch{padding:12px 16px 10px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);border-bottom:1px solid var(--border-l);display:flex;align-items:center;gap:6px}
.ch svg{width:13px;height:13px;fill:var(--brand);flex-shrink:0}
.chr{margin-left:auto;font-size:9.5px;font-weight:600;color:var(--text3);text-transform:none;letter-spacing:0}
.cb{padding:14px 16px}
/* Badges */
.bp{background:var(--purple-bg);color:var(--purple)}.bp .dot{background:var(--purple)}
.be{background:var(--info-bg);color:var(--brand)}.be .dot{background:var(--brand)}
.bt{background:#E5F3FF;color:#0057B8}.bt .dot{background:#0057B8}
.br{background:var(--warn-bg);color:var(--warn)}.br .dot{background:var(--warn)}
.bv{background:var(--ok-bg);color:var(--ok)}.bv .dot{background:var(--ok)}
/* Stepper */
.sw{padding:16px 16px 8px}
.srow{display:flex;align-items:flex-start}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}
.scon{position:absolute;top:13px;left:calc(-50% + 13px);right:calc(50% + 13px);height:2px;background:var(--border);z-index:0}
.scon.done{background:var(--brand)}.scon.ok{background:var(--ok)}.scon.wn{background:var(--warn)}
.sdot{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text3);flex-shrink:0}
.sdot.done{background:var(--brand);border-color:var(--brand);color:#fff}
.sdot.act{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 5px rgba(0,112,242,.14)}
.sdot.wn{background:var(--warn);border-color:var(--warn);color:#fff;box-shadow:0 0 0 5px rgba(231,101,0,.13)}
.sdot.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 0 0 5px rgba(16,126,62,.12)}
.sdot svg{width:12px;height:12px;fill:currentColor}
.slbl{font-size:10px;font-weight:600;color:var(--text3);margin-top:6px;text-align:center;line-height:1.3;max-width:70px}
.slbl.act{color:var(--brand);font-weight:700}.slbl.done{color:var(--brand)}
.slbl.wn{color:var(--warn);font-weight:700}.slbl.ok{color:var(--ok);font-weight:700}
/* ETA */
.etastrip{display:flex;border-top:1px solid var(--border-l)}
.etac{flex:1;padding:10px 16px;text-align:center;border-right:1px solid var(--border-l)}
.etac:last-child{border-right:none}
.etal{font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.etav{font-size:13px;font-weight:700}
/* KV */
.kv{display:flex;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border-l);gap:10px}
.kv:last-child{border-bottom:none;padding-bottom:0}
.kvi{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.kvi svg{width:14px;height:14px}
.kvr{flex:1}
.kvk{font-size:9.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.kvv{font-size:13px;font-weight:500;color:var(--text)}
.kvv.mono{font-family:monospace;font-size:11.5px}
.kvsub{font-size:11px;color:var(--text3);margin-top:2px}
/* Alert */
.alrt{border-radius:4px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start}
.alrt svg{width:15px;height:15px;flex-shrink:0;margin-top:1px}
.alrt-t{font-size:11.5px;line-height:1.5;font-weight:500}
.al-w{background:var(--warn-bg);color:var(--warn)}
.al-s{background:var(--ok-bg);color:var(--ok)}
.al-i{background:var(--info-bg);color:var(--brand)}
/* Docs */
.di{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px solid var(--border-l);cursor:pointer;border-radius:5px;transition:background .15s}
.di:last-child{border-bottom:none}
.di:hover{background:var(--info-bg)}
.dico{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px}
.dinfo{flex:1}.dname{font-size:12.5px;font-weight:600;color:var(--text)}.dmeta{font-size:10.5px;color:var(--text3);margin-top:1px}
.dlbtn{width:28px;height:28px;border-radius:5px;border:1.5px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.dlbtn:hover{border-color:var(--brand);background:var(--info-bg)}
.dlbtn svg{width:13px;height:13px;fill:var(--brand)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border-l);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi-ico{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.kpi-ico svg{width:18px;height:18px}
.kpi-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.kpi-val{font-size:20px;font-weight:700;color:var(--text);line-height:1;letter-spacing:-.02em}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:4px}
/* Products table */
.ptbl{width:100%;border-collapse:collapse}
.ptbl th{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:9px 14px;border-bottom:2px solid var(--border-l);text-align:left;background:var(--surface2);white-space:nowrap}
.ptbl td{padding:11px 14px;border-bottom:1px solid var(--border-l);font-size:12.5px;color:var(--text);vertical-align:middle}
.ptbl tr:last-child td{border-bottom:none}
.ptbl tbody tr:hover td{background:#F7FBFF}
.ptbl tfoot td{background:var(--surface2);font-weight:700;border-top:2px solid var(--border-l)}
.pemo{width:32px;height:32px;border-radius:7px;background:var(--info-bg);display:inline-flex;align-items:center;justify-content:center;font-size:14px;vertical-align:middle;margin-right:10px}
.pname{font-weight:600}
.pref{font-size:10.5px;color:var(--text3);margin-top:2px;font-family:monospace}
.blot{display:inline-block;padding:2px 7px;border-radius:4px;background:var(--neutral-bg);color:var(--neutral);font-size:10px;font-weight:600;font-family:monospace}
.pqty{font-weight:700;color:var(--brand);background:var(--info-bg);padding:3px 10px;border-radius:5px;display:inline-block}
/* Timeline */
.tl{display:flex;flex-direction:column;padding:4px 0}
.tli{display:flex;gap:14px;padding-bottom:18px}
.tli:last-child{padding-bottom:0}
.tll{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:34px}
.tlic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.tlic svg{width:16px;height:16px}
.tline{width:2px;flex:1;background:var(--border-l);margin-top:4px;min-height:18px}
.tli:last-child .tline{display:none}
.tlc{flex:1;padding-top:6px}
.tlt{font-size:13.5px;font-weight:600;color:var(--text)}
.tld{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.5}
.tlmeta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.tltime{font-size:10.5px;color:var(--text3);font-weight:500;display:flex;align-items:center;gap:4px}
.tltime svg{width:11px;height:11px;fill:var(--text3)}
.chip{display:inline-flex;padding:2px 8px;border-radius:9px;font-size:10px;font-weight:700}
.chip-b{background:var(--info-bg);color:var(--brand)}.chip-g{background:var(--ok-bg);color:var(--ok)}.chip-o{background:var(--warn-bg);color:var(--warn)}
/* Rating */
.rrow{display:flex;gap:4px;margin-top:8px}
.star{background:none;border:none;cursor:pointer;font-size:26px;padding:0;color:#D9DBDD;line-height:1}
.star.on{color:#F0A500}
/* Toast */
.toast{position:fixed;bottom:28px;right:28px;background:#1D2D3E;color:#fff;padding:12px 20px;border-radius:8px;font-size:12.5px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.show{opacity:1}
/* Tag */
.tag{display:inline-flex;padding:2px 8px;border-radius:9px;font-size:10px;font-weight:700}
.tgb{background:var(--info-bg);color:var(--brand)}
/* Misc */
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .25s ease forwards}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#ccd0d5;border-radius:3px}
</style>
</head>

<!-- DEMO BAR -->
<div class="dbar">

</div>

<!-- PAGE HEADER -->
<div class="phdr">
  <div class="bc">
    <a onclick="toast2('Mis Pedidos...')">Mis Pedidos</a>

      Abrir Incidencia
    </button>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">
  <div class="lcol" id="lcol"></div>
  <div class="rcol" id="rcol"></div>
</div>
<div class="toast" id="toast"></div>

let cur='T', stars=0;

function go(s){cur=s;stars=0;document.querySelectorAll('.dtab').forEach(b=>b.classList.toggle('on',b.dataset.s===s));render();}

function render(){
  const d=D[cur];
  const chipMap={b:'chip chip-b',g:'chip chip-g',o:'chip chip-o'};
  const LBLS=['En Prep.','Expedido',cur==='R'?'Retrasado':'En Tránsito','Entregado'];
  const STEPS=[0,1,2,4];
  const aico={i:S.info,w:S.warn,s:S.check}[d.at];
  const acls={i:'alrt al-i',w:'alrt al-w',s:'alrt al-s'}[d.at];

  // Header badge
  const hb=document.getElementById('hbadge');
  hb.className='hbadge '+d.bc;
  hb.innerHTML='<span class="dot"></span>'+d.lbl;

  // Stepper
  let stepH='<div class="srow">';
  STEPS.forEach((si,idx)=>{
    const done=d.si>si, isAct=d.si===si, isW=cur==='R'&&isAct;
    const dotCls=done?(cur==='E'?'sdot ok':'sdot done'):isW?'sdot wn':isAct?'sdot act':'sdot';
    const lblCls=done?(cur==='E'?'slbl ok':'slbl done'):isW?'slbl wn':isAct?'slbl act':'slbl';
    const dotIn=(done||(cur==='E'&&isAct))?S.cd:isW?S.wd:(idx+1);
    const conCls=done?(cur==='E'?'scon ok':'scon done'):isW?'scon wn':'scon';
    stepH+='<div class="step">';
    if(idx>0) stepH+=`<div class="${conCls}"></div>`;
    stepH+=`<div class="${dotCls}">${dotIn}</div><div class="${lblCls}">${LBLS[idx]}</div></div>`;
  });
  stepH+='</div>';

  // KPIs
  let kpiH='<div class="kpis">';
  d.kpi.forEach(k=>{
    kpiH+=`<div class="kpi fu">
      <div class="kpi-ico" style="background:${k.bg};color:${k.c}">${S[k.i]||S.info}</div>
      <div class="kpi-lbl">${k.l}</div>
      <div class="kpi-val" style="color:${k.c}">${k.v}</div>
      <div class="kpi-sub">${k.s}</div>
    </div>`;
  });
  kpiH+='</div>';

  // Timeline
  let tlH='';
  d.tl.forEach(ev=>{
    const chH=ev.ch?`<span class="${chipMap[ev.ct||'b']}">${ev.ch}</span>`:'';
    tlH+=`<div class="tli fu">
      <div class="tll">
        <div class="tlic" style="background:${ev.bg};color:${ev.c}">${S[ev.i]||S.check}</div>
        <div class="tline"></div>
      </div>
      <div class="tlc">
        <div class="tlt">${ev.t}</div>
        <div class="tld">${ev.d}</div>
        <div class="tlmeta">
          <span class="tltime">${S.tclock}&nbsp;${ev.ts}</span>
          ${chH}
        </div>
      </div>
    </div>`;
  });

  // Prods table
  let pRows='';
  PRODS.forEach(p=>{
    pRows+=`<tr>
      <td><span class="pemo">${p.e}</span></td>
      <td><div class="pname">${p.n}</div><div class="pref">${p.r}</div></td>
      <td>${p.d}</td>
      <td><span class="blot">${p.lot}</span></td>
      <td style="text-align:center"><span class="pqty">${p.q} ${p.u}</span></td>
      <td style="text-align:right">${p.price}</td>
      <td style="text-align:right;font-weight:700">${p.total}</td>
    </tr>`;
  });

  // Rating
  const ratingH=d.rating?`
    <div style="padding:14px 16px;border-top:1px solid var(--border-l)">
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:2px">Valore la experiencia de entrega</div>
      <div class="rrow">${[1,2,3,4,5].map(n=>`<button class="star ${stars>=n?'on':''}" onclick="rate(${n})">&#9733;</button>`).join('')}</div>
      ${stars>0?'<div style="font-size:11px;color:var(--ok);margin-top:6px;font-weight:600">Gracias por su valoración.</div>':''}
    </div>`:'';

  // LEFT COL
  document.getElementById('lcol').innerHTML=`
    <!-- Status card -->
    <div class="card fu">
      <div class="sw">${stepH}</div>
      <div class="etastrip">
        <div class="etac"><div class="etal">Fecha pedido</div><div class="etav">19/05/2025</div></div>
        <div class="etac"><div class="etal">${d.el}</div><div class="etav" style="color:${cur==='R'?'var(--warn)':cur==='E'?'var(--ok)':'var(--text)'}">${d.ev}</div></div>
        <div class="etac"><div class="etal">${cur==='E'?'Hora entrega':cur==='R'?'Estado':'Tiempo est.'}</div><div class="etav">${d.e3}</div></div>
      </div>
      <div style="padding:12px 16px 14px">
        <div class="${acls}">${aico}<span class="alrt-t">${d.am}</span></div>
      </div>
      ${ratingH}
    </div>

    <!-- Shipping info -->
    <div class="card fu">
      <div class="ch">${S.pin}Información de Envío</div>
      <div class="cb">
        <div class="kv">
          <div class="kvi" style="background:#E8F2FD;color:var(--brand)">${S.usr}</div>
          <div class="kvr"><div class="kvk">Cliente</div><div class="kvv">Farmacia El Rosal</div><div class="kvsub">Código: FAR-08192 · Segmento: Farmacia comunitaria</div></div>
        </div>
        <div class="kv">
          <div class="kvi" style="background:#E8F2FD;color:var(--brand)">${S.pin}</div>
          <div class="kvr"><div class="kvk">Dirección de entrega</div><div class="kvv">C/ Gràcia, 142</div><div class="kvsub">08012 Barcelona, Catalunya</div></div>
        </div>
        <div class="kv">
          <div class="kvi" style="background:#E8F2FD;color:var(--brand)">${S.truck}</div>
          <div class="kvr"><div class="kvk">Transportista</div><div class="kvv">DHL Express Farma</div><div class="kvsub">Priority Pharma 24h · Temperatura controlada 2–25°C</div></div>
        </div>
        <div class="kv">
          <div class="kvi" style="background:#E8F5EE;color:var(--ok)">${S.doc}</div>
          <div class="kvr"><div class="kvk">Nº de seguimiento</div><div class="kvv mono">1Z999AA10123456784</div>
            <div style="margin-top:5px"><span class="tag tgb" style="cursor:pointer" onclick="toast2('Abriendo tracking DHL...')">Ver en DHL ↗</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Order details -->
    <div class="card fu">
      <div class="ch">${S.list}Detalles del Pedido</div>
      <div class="cb">
        <div class="kv">
          <div class="kvi" style="background:#EEF0F2;color:#5C6873">${S.doc}</div>
          <div class="kvr"><div class="kvk">Orden de compra</div><div class="kvv mono">OC-FAR-2025-00831</div></div>
        </div>
        <div class="kv">
          <div class="kvi" style="background:#EEF0F2;color:#5C6873">${S.info}</div>
          <div class="kvr"><div class="kvk">Canal de pedido</div><div class="kvv">Portal de Clientes · Web</div></div>
        </div>
        <div class="kv">
          <div class="kvi" style="background:#EEF0F2;color:#5C6873">${S.usr}</div>
          <div class="kvr"><div class="kvk">Gestor de cuenta</div><div class="kvv">Laura González Martín</div><div class="kvsub">Región: Cataluña · lau.gonzalez@normon.es</div></div>
        </div>
        <div class="kv">
          <div class="kvi" style="background:#EEF0F2;color:#5C6873">${S.info}</div>
          <div class="kvr"><div class="kvk">Condiciones de pago</div><div class="kvv">30 días neto · SEPA débito</div></div>
        </div>
        <div class="kv">
          <div class="kvi" style="background:#EEF0F2;color:#5C6873">${S.euro}</div>
          <div class="kvr"><div class="kvk">Importe total (IVA incl.)</div><div class="kvv" style="font-size:16px;font-weight:700;color:var(--text)">1.284,60 €</div><div class="kvsub">Base imponible: 1.062,70 € · IVA 21%: 222,17 €</div></div>
        </div>
      </div>
    </div>

    <!-- Documents -->
    <div class="card fu">
      <div class="ch">${S.doc}Documentos</div>
      <div class="cb">
        <div class="di" onclick="toast2('Descargando albarán...')"><div class="dico" style="background:#E8F2FD">📄</div><div class="dinfo"><div class="dname">Albarán de entrega</div><div class="dmeta">ALB-2025-049017 · PDF · 128 KB</div></div><button class="dlbtn">${S.dl}</button></div>
        <div class="di" onclick="toast2('Descargando factura...')"><div class="dico" style="background:#E8F5EE">🧾</div><div class="dinfo"><div class="dname">Factura</div><div class="dmeta">FAC-2025-038441 · PDF · 96 KB</div></div><button class="dlbtn">${S.dl}</button></div>
        <div class="di" onclick="toast2('Descargando certificados...')"><div class="dico" style="background:#F0EFFC">📋</div><div class="dinfo"><div class="dname">Certificado análisis de lotes</div><div class="dmeta">MET/AMO/SIM/CUR · PDF · 340 KB</div></div><button class="dlbtn">${S.dl}</button></div>
      </div>
    </div>
  `;

  // RIGHT COL
  document.getElementById('rcol').innerHTML=`
    <!-- KPIs -->
    ${kpiH}

    <!-- Products -->
    <div class="card fu">
      <div class="ch">${S.pkg}Artículos del Pedido<span class="chr">4 referencias · 15 unidades · 4,2 kg</span></div>
      <div style="overflow-x:auto">
        <table class="ptbl">
          <thead>
            <tr>
              <th style="width:40px"></th>
              <th>Producto</th>
              <th>Descripción</th>
              <th>Lote</th>
              <th style="text-align:center">Cantidad</th>
              <th style="text-align:right">P. unitario</th>
              <th style="text-align:right">Total</th>
            </tr>
          </thead>
          <tbody>${pRows}</tbody>
          <tfoot>
            <tr>
              <td colspan="5" style="font-size:11px;color:var(--text3)">Base imponible</td>
              <td></td>
              <td style="text-align:right;color:var(--text)">1.062,70 €</td>
            </tr>
            <tr>
              <td colspan="5" style="font-size:11px;color:var(--text3)">IVA (21%)</td>
              <td></td>
              <td style="text-align:right;color:var(--text)">222,17 €</td>
            </tr>
            <tr>
              <td colspan="5" style="font-size:12px;font-weight:700">TOTAL</td>
              <td></td>
              <td style="text-align:right;font-size:15px;font-weight:700;color:var(--brand)">1.284,60 €</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <!-- Timeline -->
    <div class="card fu">
      <div class="ch">${S.hist}Historial de Eventos<span class="chr">${d.tl.length} eventos registrados</span></div>
      <div class="cb">
        <div class="tl">${tlH}</div>
      </div>
    </div>
  `;

  if(d.rating){
    document.querySelectorAll('.star').forEach((s,i)=>{s.onclick=()=>rate(i+1);});
  }
}

function rate(n){
  stars=n;
  document.querySelectorAll('.star').forEach((s,i)=>s.classList.toggle('on',n>i));
  const fb=document.querySelector('.rrow+div');
  if(!fb){const row=document.querySelector('.rrow');if(row){const d=document.createElement('div');d.style.cssText='font-size:11px;color:var(--ok);margin-top:6px;font-weight:600';d.textContent='Gracias por su valoración.';row.parentNode.appendChild(d);}}
}

let tt;
function toast2(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}

render();
</script>
</body>
</html>
